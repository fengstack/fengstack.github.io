<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="favTop" x1="22" y1="12" x2="42" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="favMid" x1="16" y1="24" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- High contrast dark squircle for favicon clarity in all browser tabs (dark & light UI) -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>

  <!-- Tier 1: Foundation (Data) -->
  <path d="M12 45L32 36L52 45L32 54L12 45Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Tier 2: Distributed RPC -->
  <path d="M16 33L32 24L48 33L32 42L16 33Z" fill="url(#favMid)" stroke="#60A5FA" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Tier 3: Apex Peak -->
  <path d="M22 20L32 13L42 20L32 27L22 20Z" fill="url(#favTop)" stroke="#BAE6FD" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Vertical Data Bus (Spine of F) -->
  <path d="M22 18V48" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="22" cy="20" r="3.5" fill="#FFFFFF"/>
  <circle cx="22" cy="33" r="3" fill="#BAE6FD"/>
  <circle cx="22" cy="45" r="2.5" fill="#38BDF8"/>

  <!-- Peak Beacon -->
  <circle cx="32" cy="13" r="3.5" fill="#FFFFFF"/>
</svg>
