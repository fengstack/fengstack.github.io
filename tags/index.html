  <script>
    (function(){
      var T = function(d){ if(d){ document.documentElement.setAttribute('data-theme', d); } };
      try { var s = localStorage.getItem('gw-theme'); if (s) T(s); } catch(e){}
      window.__toggleTheme = function(){
        var cur = document.documentElement.getAttribute('data-theme');
        var dark = cur === 'dark' || (!cur && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var next = dark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('gw-theme', next); } catch(e){}
      };
    })();
  </script>
